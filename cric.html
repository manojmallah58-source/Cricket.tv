<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>cricbomb - Live Stream</title>
  
  <!-- Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@700;800&family=Bebas+Neue&family=Chakra+Petch:wght@700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ========================================================
       PREMIUM OTT THEME & COLOR VARIABLES
       ======================================================== */
    :root {
      --app-bg: #060811;
      --app-navy: #0b1120;
      --app-surface: rgba(14, 21, 38, 0.75);
      --app-card: rgba(16, 24, 48, 0.7);
      --app-border: rgba(255, 255, 255, 0.08);
      --app-blue: #0f62fe;
      --app-cyan: #00d2ff;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --glass-blur: blur(16px);
    }

    * {
      box-sizing: border-box;
      outline: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--app-bg);
      background-image: 
        radial-gradient(ellipse at 50% -15%, #182852 0%, #060811 65%, #04050a 100%),
        radial-gradient(circle at 100% 65%, rgba(15, 98, 254, 0.1) 0%, transparent 45%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: var(--text-main);
      padding-bottom: 25px;
      overflow-x: hidden;
      min-height: 100vh;
      width: 100%;
    }

    /* ========================================================
       CLEAN SPLASH SCREEN
       ======================================================== */
    #loading-screen {
      position: fixed;
      inset: 0;
      background: #05070f;
      background-image: radial-gradient(circle at 50% 45%, #14244d 0%, #070a16 65%, #030408 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 22px;
      z-index: 99999;
      transition: opacity 0.45s ease, visibility 0.45s;
    }
    .splash-logo-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .splash-glow-halo {
      position: absolute;
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0, 210, 255, 0.35) 0%, transparent 70%);
      filter: blur(16px);
      animation: splashAura 2s infinite ease-in-out;
    }
    .splash-logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 46px;
      color: #fff;
      letter-spacing: 3px;
      text-transform: uppercase;
      position: relative;
      z-index: 2;
      text-shadow: 0 0 25px rgba(15, 98, 254, 0.7);
      animation: pulseSplashText 1.9s infinite ease-in-out;
      margin: 0;
      line-height: 1;
    }
    @keyframes splashAura {
      0%, 100% { transform: scale(0.9); opacity: 0.5; }
      50% { transform: scale(1.3); opacity: 0.95; }
    }
    @keyframes pulseSplashText {
      0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(15, 98, 254, 0.5); }
      50% { transform: scale(1.05); text-shadow: 0 0 35px rgba(0, 210, 255, 0.85); }
    }
    .splash-progress-track {
      width: 150px;
      height: 3.5px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .splash-progress-bar {
      width: 50%;
      height: 100%;
      background: linear-gradient(90deg, var(--app-blue), var(--app-cyan));
      border-radius: 6px;
      position: absolute;
      animation: progressSweep 1.1s infinite ease-in-out;
    }
    @keyframes progressSweep {
      0% { left: -50%; }
      100% { left: 100%; }
    }

    /* ========================================================
       TOP HEADER BAR
       ======================================================== */
    header {
      height: 52px;
      background: rgba(8, 12, 23, 0.88);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--app-border);
      display: flex;
      align-items: center;
      justify-content: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      padding: 0 16px;
    }
    .header-logo-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .header-logo-text {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      color: #fff;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(15, 98, 254, 0.45);
      margin: 0;
      line-height: 1;
    }
    .stream-live-badge {
      position: absolute;
      right: -62px;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(135deg, #e50914, #c0040e);
      color: #fff;
      font-size: 8px;
      font-weight: 900;
      padding: 2.5px 6.5px;
      border-radius: 4px;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 4px;
      box-shadow: 0 2px 10px rgba(229, 9, 20, 0.5);
    }
    .live-pulse-dot {
      width: 4px;
      height: 4px;
      background: #fff;
      border-radius: 50%;
      animation: pulseDot 0.9s infinite;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.6); }
    }

    /* ========================================================
       MAIN PLAYER STAGE
       ======================================================== */
    #main-stage {
      width: 100%;
      position: relative;
      background: #000;
      border-bottom: 1px solid var(--app-border);
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85);
    }
    .video-box {
      width: 100%;
      aspect-ratio: 16/9;
      background: #000;
      position: relative;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }

    /* ========================================================
       STREAM META BAR
       ======================================================== */
    .stream-room-meta {
      background: rgba(11, 17, 32, 0.85);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-bottom: 1px solid var(--app-border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .stream-room-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
    }
    .channel-header-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .channel-name-txt {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 13.5px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.4px;
    }
    .verified-badge {
      color: var(--app-cyan);
      font-size: 15px;
      display: flex;
      align-items: center;
    }
    .stream-room-sub {
      font-size: 9.5px;
      color: var(--text-sub);
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    /* ========================================================
       ACTIONS AREA
       ======================================================== */
    .room-actions-container {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 520px;
      margin: 0 auto;
      width: 100%;
    }

    .vip-telegram-pass {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 12px 16px;
      background: linear-gradient(135deg, #0f62fe 0%, #0043ce 100%);
      border: 1.5px solid rgba(0, 210, 255, 0.55);
      border-radius: 14px;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(15, 98, 254, 0.45);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.15s ease;
      animation: cardGlow 2.5s infinite alternate;
    }
    @keyframes cardGlow {
      0% { box-shadow: 0 6px 20px rgba(15, 98, 254, 0.4); border-color: rgba(0, 210, 255, 0.4); }
      100% { box-shadow: 0 10px 30px rgba(0, 210, 255, 0.75); border-color: rgba(0, 210, 255, 0.95); }
    }
    .vip-telegram-pass:active { transform: scale(0.97); }
    .vip-telegram-pass::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -60%;
      width: 35%;
      height: 200%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255
