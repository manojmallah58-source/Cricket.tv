<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Aman army cricket - Live Stream</title>
  
  <!-- Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=Space+Grotesk:wght@700;800&family=Bebas+Neue&display=swap" rel="stylesheet">
  
  <style>
    /* VARIABLES */
    :root {
      --app-bg: #060811;
      --app-card: rgba(16, 24, 48, 0.7);
      --app-border: rgba(255, 255, 255, 0.08);
      --app-blue: #0f62fe;
      --app-cyan: #00d2ff;
      --glass-blur: blur(16px);
    }
    * { box-sizing: border-box; outline: none; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
    body {
      background: var(--app-bg);
      background-image: radial-gradient(ellipse at 50% -15%, #182852 0%, #060811 65%, #04050a 100%), radial-gradient(circle at 100% 65%, rgba(15, 98, 254, 0.1) 0%, transparent 45%);
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc; padding-bottom: 25px; overflow-x: hidden; min-height: 100vh;
    }

    /* SPLASH SCREEN */
    #loading-screen {
      position: fixed; inset: 0; background: #05070f;
      background-image: radial-gradient(circle at 50% 45%, #14244d 0%, #070a16 65%, #030408 100%);
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 22px; z-index: 99999;
      transition: opacity 0.45s ease;
    }
    .splash-logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 46px; color: #fff; letter-spacing: 3px; text-shadow: 0 0 25px rgba(15, 98, 254, 0.7); animation: pulseSplashText 1.9s infinite ease-in-out; }
    @keyframes pulseSplashText { 0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(15, 98, 254, 0.5); } 50% { transform: scale(1.05); text-shadow: 0 0 35px rgba(0, 210, 255, 0.85); } }

    /* HEADER */
    header { height: 52px; background: rgba(8, 12, 23, 0.88); backdrop-filter: var(--glass-blur); -webkit-backdrop-filter: var(--glass-blur); border-bottom: 1px solid var(--app-border); display: flex; align-items: center; justify-content: center; position: sticky; top: 0; z-index: 1000; }
    .header-logo-text { font-family: 'Bebas Neue', sans-serif; font-size: 26px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(15, 98, 254, 0.45); }

    /* PLAYER STAGE */
    #main-stage { width: 100%; position: relative; background: #000; border-bottom: 1px solid var(--app-border); box-shadow: 0 12px 35px rgba(0, 0, 0, 0.85); }
    .video-box { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
    iframe { width: 100%; height: 100%; border: none; display: block; position: absolute; top: 0; left: 0; }

    /* CHANNEL META INFO */
    .stream-room-meta { background: rgba(11, 17, 32, 0.85); border-bottom: 1px solid var(--app-border); padding: 10px 14px; }
    .channel-name-txt { font-family: 'Space Grotesk', sans-serif; font-size: 13.5px; font-weight: 800; color: #fff; text-transform: uppercase; }

    /* ACTIONS AREA */
    .room-actions-container { padding: 12px 14px; display: flex; flex-direction: column; gap: 15px; max-width: 520px; margin: 0 auto; }
    .vip-telegram-pass { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: linear-gradient(135deg, #0f62fe 0%, #0043ce 100%); border: 1.5px solid rgba(0, 210, 255, 0.55); border-radius: 14px; color: #fff; text-decoration: none; animation: cardGlow 2.5s infinite alternate; }
    @keyframes cardGlow { 0% { box-shadow: 0 6px 20px rgba(15, 98, 254, 0.4); } 100% { box-shadow: 0 10px 30px rgba(0, 210, 255, 0.75); } }
    .vip-text-title { font-size: 13.5px; font-weight: 800; text-transform: uppercase; }
    .vip-text-desc { font-size: 10px; font-weight: 600; }
    .btn-tap-pill { background: #fff; color: #0f62fe; font-size: 11px; font-weight: 900; padding: 7px 12px; border-radius: 8px; }

    .controls-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .interactive-btn { background: var(--app-card); border: 1px solid var(--app-border); color: #e2e8f0; padding: 10px; border-radius: 11px; font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; }
    .interactive-btn i { font-size: 16px; color: var(--app-cyan); }

    /* CHANNELS LIST CSS */
    .channel-list-container { margin-top: 5px; width: 100%; }
    .category-group { margin-bottom: 20px; }
    .category-title {
      font-size: 13px; font-weight: 800; color: var(--app-cyan); 
      margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.8px;
      padding-bottom: 5px; border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      display: flex; align-items: center; gap: 6px;
    }
    .channels-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    
    .channel-item {
      background: rgba(14, 21, 38, 0.8); border: 1px solid var(--app-border);
      border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 8px;
      text-decoration: none; color: #fff; transition: all 0.2s ease;
    }
    .channel-item:hover, .channel-item:active { background: rgba(15, 98, 254, 0.15); border-color: rgba(0, 210, 255, 0.4); }
    .channel-icon { background: rgba(255, 255, 255, 0.1); width: 26px; height: 26px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .channel-icon i { font-size: 16px; color: var(--app-cyan); }
    .channel-name { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; }

    /* OVERLAYS */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.88); backdrop-filter: blur(14px); z-index: 9000; justify-content: center; align-items: center; padding: 16px; }
    .overlay.active { display: flex; }
    .popup { background: linear-gradient(165deg, rgba(20, 27, 48, 0.96), rgba(9, 13, 24, 0.98)); border: 1px solid rgba(0, 210, 255, 0.45); border-radius: 20px; padding: 22px 18px; width: 100%; max-width: 320px; text-align: center; }
    .btn-join { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--app-blue) 0%, #0043ce 100%); color: #fff; border-radius: 10px; font-weight: 800; cursor: pointer; border: none; margin-bottom: 10px; }
    .btn-already { width: 100%; padding: 10px; background: rgba(255, 255, 255, 0.05); color: #94a3b8; border-radius: 10px; font-weight: 700; cursor: pointer; border: 1px solid rgba(255, 255, 255, 0.12); }
    #error-screen { display: none; position: fixed; inset: 0; background: var(--app-bg); align-items: center; justify-content: center; flex-direction: column; z-index: 9998; text-align: center; }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="loading-screen">
    <h1 class="splash-logo-text">Aman army cricket</h1>
  </div>

  <!-- ERROR SCREEN -->
  <div id="error-screen">
    <h2 style="color: #e50914; font-family: Bebas Neue; font-size: 32px;">STREAM OFFLINE</h2>
    <p id="error-msg" style="color: #94a3b8; font-size: 13px; margin: 10px 0;">This stream channel is not transmitting.</p>
    <a href="javascript:location.reload()" style="padding:8px 16px; background:var(--app-blue); color:#fff; border-radius:8px; text-decoration:none; font-weight:800; font-size:12px;">RELOAD</a>
  </div>

  <!-- HEADER -->
  <header>
    <h1 class="header-logo-text">Aman army cricket</h1>
  </header>

  <!-- PLAYER STAGE -->
  <div id="main-stage">
    <div class="video-box">
      <iframe id="main-player" allowfullscreen="true" scrolling="no" allow="autoplay; encrypted-media"></iframe>
    </div>
  </div>

  <!-- META -->
  <div class="stream-room-meta">
    <span class="channel-name-txt" id="channel-name">LIVE BROADCAST</span>
  </div>

  <!-- ACTIONS & CHANNELS LIST -->
  <div class="room-actions-container">
    
    <a href="https://t.me/+mQXe_zKZQlgyZjY1" target="_blank" onclick="unlockStream()" class="vip-telegram-pass">
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="vip-text-box">
          <div class="vip-text-title">Join Official Telegram</div>
          <div class="vip-text-desc">1-Click Tap • Instant VIP Pass</div>
        </div>
      </div>
      <div class="btn-tap-pill">TAP HERE 👉</div>
    </a>

    <div class="controls-grid">
      <button onclick="location.reload()" class="interactive-btn"><i class="material-icons">refresh</i> Reload</button>
      <button onclick="navigator.clipboard.writeText(window.location.href); alert('Link Copied!')" class="interactive-btn"><i class="material-icons">share</i> Share</button>
    </div>

    <!-- DYNAMIC SECTIONED CHANNELS CONTAINER -->
    <div class="channel-list-container" id="channelListSection" style="display: none;"></div>
  </div>

  <!-- POPUP -->
  <div class="overlay" id="forcePop">
    <div class="popup">
      <h2 style="color:#fff; margin-bottom:10px; font-family:'Bebas Neue'; letter-spacing:1px;">Unlock Full Access</h2>
      <p style="color:#94a3b8; font-size:12px; margin-bottom:20px;">Join our official Telegram to unlock HD access.</p>
      <button class="btn-join" onclick="goTelegram()">Join Telegram Channel</button>
      <button class="btn-already" onclick="unlockStream()">Already Joined</button>
    </div>
  </div>

  <script>
    const CONFIG = { preview: 5000 };
    const JSON_URL = "https://cricket-yoddha-2-o-json.pages.dev/links.json"; 
    const TELEGRAM_LINK = "https://t.me/+mQXe_zKZQlgyZjY1";

    window.onload = () => {
      setTimeout(() => { document.getElementById('forcePop').classList.add('active'); }, CONFIG.preview);
      loadStream();
    };

    async function loadStream() {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");
      
      try {
        const response = await fetch(JSON_URL + "?t=" + Date.now());
        const data = await response.json();
        
        renderCategorizedChannels(data);

        if (!id) {
          showError("Please scroll down and select a channel from the categories.");
          return;
        }

        let iframeSrc = "";
        let channelTitle = id.replace(/[-_]/g, ' ').toUpperCase();

        if (data.iframes) {
          const found = data.iframes.find(x => x.id === id);
          if (found) {
            iframeSrc = found.iframeSrc;
            channelTitle = found.name || id;
          }
        }

        if (!iframeSrc || iframeSrc.trim() === "") {
          showError("Channel stream not available right now.");
          return;
        }

        document.getElementById('channel-name').innerText = channelTitle.toUpperCase();
        document.getElementById('main-player').src = iframeSrc;
        
        document.getElementById('loading-screen').style.opacity = '0';
        setTimeout(() => { document.getElementById('loading-screen').style.display = 'none'; }, 450);

      } catch (e) {
        showError("Failed to fetch stream details.");
      }
    }

    function renderCategorizedChannels(data) {
      const container = document.getElementById('channelListSection');
      
      if (data.iframes && data.iframes.length > 0) {
        container.style.display = 'block';
        container.innerHTML = '';
        
        // Exact order defined here
        const categoryOrder = ["Star Sports", "Sony Sports", "iPhone", "World Wide", "Others"];
        const groupedChannels = {};
        categoryOrder.forEach(cat => groupedChannels[cat] = []);

        // Distribute channels
        data.iframes.forEach(ch => {
          if (ch.iframeSrc && ch.iframeSrc.trim() !== "") {
            let cat = categoryOrder.includes(ch.category) ? ch.category : "Others";
            groupedChannels[cat].push(ch);
          }
        });

        // Build HTML strictly in the predefined order
        categoryOrder.forEach(cat => {
          if (groupedChannels[cat].length > 0) {
            let catWrapper = document.createElement('div');
            catWrapper.className = 'category-group';
            
            let icon = cat === "iPhone" ? "phone_iphone" : cat === "World Wide" ? "public" : "live_tv";
            let titleHTML = `<div class="category-title"><i class="material-icons">${icon}</i> ${cat}</div>`;
            
            let gridHTML = `<div class="channels-grid">`;
            groupedChannels[cat].forEach(ch => {
              gridHTML += `
                <a href="?id=${ch.id}" class="channel-item">
                  <div class="channel-icon"><i class="material-icons">play_arrow</i></div>
                  <span class="channel-name">${ch.name}</span>
                </a>
              `;
            });
            gridHTML += `</div>`;
            
            catWrapper.innerHTML = titleHTML + gridHTML;
            container.appendChild(catWrapper);
          }
        });
      }
    }

    function showError(msg) {
      document.getElementById('loading-screen').style.display = 'none';
      document.getElementById('error-screen').style.display = 'flex';
      document.getElementById('error-msg').innerText = msg;
    }

    function unlockStream() { document.getElementById('forcePop').classList.remove('active'); }
    function goTelegram() { unlockStream(); window.open(TELEGRAM_LINK, "_blank"); }
  </script>
</body>
</html>
